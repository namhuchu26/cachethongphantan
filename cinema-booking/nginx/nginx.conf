# Nginx = load balancer: chia request cho 3 Booking Server theo vòng (round-robin).
upstream booking {
    zone booking 64k;
    # DNS nội bộ của Docker; "resolve" giúp Nginx tìm lại IP khi container khởi động lại
    resolver 127.0.0.11 valid=5s ipv6=off;
    # 3 lần lỗi liên tiếp trong 5 giây → tạm coi server đã chết, 5 giây sau thử lại
    server booking-1:3000 resolve max_fails=3 fail_timeout=5s;
    server booking-2:3000 resolve max_fails=3 fail_timeout=5s;
    server booking-3:3000 resolve max_fails=3 fail_timeout=5s;
    # giữ sẵn kết nối tới server (không mở TCP mới cho mỗi request) → chịu tải tốt hơn
    keepalive 64;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Trang tĩnh (frontend)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API: nếu server không kết nối được thì thử server kế tiếp (chịu lỗi)
    location /api/ {
        proxy_pass http://booking;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 1s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header X-Upstream $upstream_addr always;
    }

    # Socket.IO (WebSocket). Client chỉ dùng transport websocket nên không cần sticky session.
    location /socket.io/ {
        proxy_pass http://booking;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_connect_timeout 1s;
        proxy_read_timeout 1h;
    }
}
