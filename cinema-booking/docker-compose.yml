# Hệ thống đặt vé xem phim phân tán
# Chạy:  docker compose up -d --build     → mở http://localhost:8080
x-booking: &booking
  build: ./booking-service
  restart: unless-stopped
  environment: &booking-env
    PORT: "3000"
    REDIS_URL: redis://redis:6379
    DATABASE_URL: postgres://cinema:cinema@postgres:5432/cinema
    AMQP_URL: amqp://cinema:cinema@rabbitmq:5672
    JWT_SECRET: doi-thanh-chuoi-bi-mat
    HOLD_TTL_SECONDS: "300"
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }

services:
  postgres:
    image: postgres:16-alpine
    container_name: cinema-postgres
    environment:
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema
      POSTGRES_DB: cinema
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema -d cinema"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: cinema-redis
    # Ex = bật thông báo khi key hết hạn (Expiry Listener cần)
    command: ["redis-server", "--notify-keyspace-events", "Ex"]
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cinema-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: cinema
      RABBITMQ_DEFAULT_PASS: cinema
    ports: ["15673:15672"]   # trang quản trị RabbitMQ: http://localhost:15673 (cinema/cinema)
    volumes:
      - mqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 30

  booking-1:
    <<: *booking
    container_name: booking-1
    environment: { <<: *booking-env, SERVER_NAME: booking-1 }

  booking-2:
    <<: *booking
    container_name: booking-2
    environment: { <<: *booking-env, SERVER_NAME: booking-2 }

  booking-3:
    <<: *booking
    container_name: booking-3
    environment: { <<: *booking-env, SERVER_NAME: booking-3 }

  payment-worker:
    build: ./payment-worker
    container_name: payment-worker
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://cinema:cinema@postgres:5432/cinema
      AMQP_URL: amqp://cinema:cinema@rabbitmq:5672
      PAYMENT_DELAY_MS: "800"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  expiry-listener:
    build: ./expiry-listener
    container_name: expiry-listener
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis: { condition: service_healthy }

  nginx:
    image: nginx:alpine
    container_name: cinema-nginx
    ports: ["8080:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on: [booking-1, booking-2, booking-3]

volumes:
  pgdata:
  mqdata:
